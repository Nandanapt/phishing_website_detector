<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Result</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="container">
        <h2>URL: {{ url }}</h2>
        <!-- Apply the class based on the prediction result -->
        <div class="result-box {{ prediction_class }}">
            <h1>{{ prediction }}</h1>
        </div>
        <a href="/">Check Another</a>
    </div>
</body>
</html>
